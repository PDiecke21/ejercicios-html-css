<h1>Registro de estudiantes</h1>

<body>
    <form action="/action_page.php">
        <p>Nombre</p>
        <input type="text" id="fname" name="fname"><br>
        <p>Apellidos</p>
        <input type="text" id="lname" name="lname"><br><br>
        <hr>
        <p>Correo electrónico</p>
        <input type="text" id="fname" name="fname"><br>
        <hr>
        <p>DNI</p>
        <input type="text" id="lname" name="lname"><br><br>
        <hr>
        <p>Ciudad</p>
        <input type="text" id="lname" name="lname"><br><br>
        <hr>
        <p>Teléfono</p>
        <input type="text" id="lname" name="lname"><br><br>
        <hr>
        <p>Ciclo formativo en el que está matriculado</p>
        <input type="text" id="lname" name="lname"><br><br>
        <hr>
        <p>Género</p>
        <input type="radio">
        <label for="lname">Masculino:</label><br>
        <input type="radio">
        <label for="lname">Femenino:</label><br>
        <hr>
        <p>Turno preferido: mañana o tarde</p>
        <input type="radio">
        <label for="lname">Mañana:</label><br>
        <input type="radio">
        <label for="lname">Tarde:</label><br>
        <hr>
        <p>Modalidad</p>
        <input type="radio">
        <label for="lname">Presencial:</label><br>
        <input type="radio">
        <label for="lname">Semipresencial:</label><br>
        <input type="radio">
        <label for="lname">Online:</label><br>
        <hr>
        <p>Aficiones</p>
        <input type="checkbox">
        <label for="lname">Deportes:</label><br>
        <input type="checkbox">
        <label for="lname">Informática:</label><br>
        <input type="checkbox">
        <label for="lname">Videojuegos:</label><br>
        <hr>

        <hr>
        <p>Política de privacidad</p>
        <input type="checkbox" name="aceptar_privacidad" id="aceptar_privacidad" required />
        He leído y acepto la <a href="/politica-privacidad" target="_blank">Política de Privacidad</a>.
        <hr>
        <p>Contraseña</p>
        <input type="password">
        <hr>
        <input type="submit" value="Registrar">
    </form>
</body>
