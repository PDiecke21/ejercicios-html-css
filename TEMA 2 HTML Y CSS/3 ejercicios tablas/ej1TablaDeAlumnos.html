<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de alumnos</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        /* Colores para la nota */
        .aprobado {
            background-color: #c8e6c9; /* Verde */
            color: #256029;
        }
        .suspenso {
            background-color: #ffcdd2; /* Rojo */
            color: #c62828;
        }
    </style>
</head>
<body>

    <h1>Listado de alumnos</h1>

    <table>
        <tr>
            <th>Nº Alumno</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Curso</th>
            <th>Nota media</th>
        </tr>
        
        <!-- Alumnos obligatorios de la imagen -->
        <tr>
            <td>1</td>
            <td>Carla</td>
            <td>Montes</td>
            <td>1º ESO</td>
            <td class="aprobado">9</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Juan</td>
            <td>León</td>
            <td>1º ESO</td>
            <td class="aprobado">8</td>
        </tr>
        
        <!-- Alumno personalizado -->
        <tr>
            <td>3</td>
            <td>Pablo</td>
            <td>Diecke</td>
            <td>1º ESO</td>
            <td class="aprobado">7.5</td>
        </tr>
        
        <!-- Resto de alumnos (puedes cambiar estos nombres también) -->
        <tr>
            <td>4</td>
            <td>Lucas</td>
            <td>Martín</td>
            <td>1º ESO</td>
            <td class="suspenso">4</td>
        </tr>
        <tr>
            <td>5</td>

            <td>Pérez</td>
            <td>1º ESO</td>
            <td class="aprobado">6</td>
        </tr>
        <tr>
            <td>6</td>
            <td>Elena</td>
            <td>Sánchez</td>
            <td>1º ESO</td>
            <td class="suspenso">3</td>
        </tr>
        <tr>
            <td>7</td>
            <td>Diego</td>
            <td>Gómez</td>
            <td>1º ESO</td>
            <td class="aprobado">10</td>
        </tr>
        <tr>
            <td>8</td>
            <td>Alba</td>
            <td>Ruiz</td>
            <td>1º ESO</td>
            <td class="aprobado">5</td>
        </tr>
    </table>

</body>
</html>
